spring.application.name=petcare-hub
petcare.matching.default-strategy=weighted
petcare.matching.budget-multiplier=3
petcare.matching.weights.size=10
petcare.matching.weights.space=15
petcare.matching.weights.activity=20
petcare.matching.weights.time=20
petcare.matching.weights.budget=20
petcare.matching.weights.experience=10
petcare.matching.weights.shedding=5
petcare.appointments.open=08:00
petcare.appointments.close=18:00
petcare.appointments.working-days=MONDAY,TUESDAY,WEDNESDAY,THURSDAY,FRIDAY,SATURDAY
petcare.appointments.slot-minutes=30
petcare.vaccinations.due-soon-days=7
petcare.vaccinations.annual-booster-years=3
petcare.vaccinations.scheduler.enabled=true
petcare.vaccinations.scheduler.cron=0 0 1 * * *
spring.datasource.url=${DB_URL:jdbc:sqlserver://localhost:1433;databaseName=petcare_hub;encrypt=true;trustServerCertificate=true}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

