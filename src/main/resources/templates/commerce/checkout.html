<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Đặt hàng')}"></head>
<body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <h1>Đặt hàng</h1>
    <p><a th:href="@{/cart}">Quay lại giỏ hàng</a> · <a th:href="@{/products}">Xem danh mục</a></p>
    <p th:unless="${cart.checkoutAllowed}" class="alert alert-warning">Giỏ hàng trống hoặc có sản phẩm chưa thể mua. Vui lòng kiểm tra giỏ hàng.</p>
    <div th:if="${cart.checkoutAllowed}">
        <ul class="list-group mb-3"><li class="list-group-item d-flex justify-content-between" th:each="item : ${cart.items}">
            <span th:text="${item.name + ' × ' + item.quantity}"></span><span th:text="${item.total + ' VNĐ'}"></span>
        </li></ul>
        <p class="fw-bold" th:text="${'Tạm tính: ' + cart.total + ' VNĐ'}"></p>
        <div th:replace="~{loyalty/fragments :: quote}"></div>
        <p class="text-muted">Giá được chốt khi đặt hàng. Tồn kho được kiểm tra lại khi cửa hàng xác nhận đơn.</p>
        <form th:action="@{/checkout}" th:object="${checkoutForm}" method="post">
            <label class="form-label" for="shippingAddress">Địa chỉ giao hàng</label>
            <textarea class="form-control mb-2" id="shippingAddress" th:field="*{shippingAddress}" required maxlength="1000" rows="3"></textarea>
            <p class="text-danger" th:if="${#fields.hasErrors('shippingAddress')}" th:errors="*{shippingAddress}"></p>
            <button class="btn btn-primary">Đặt hàng</button>
        </form>
    </div>
</main>
<footer th:replace="~{fragments/layout :: footer}"></footer>
</body></html>
