<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<div th:fragment="purchase(product)" class="mt-3">
    <p class="alert alert-warning" th:if="${product.packageSuspended}">Gói tạm ngừng bán: cần cấu hình ít nhất một dịch vụ áp dụng hợp lệ.
        <span sec:authorize="hasAnyRole('STAFF','ADMIN')">Vui lòng sửa gói và chọn dịch vụ đang hiển thị trước khi bán tiếp.</span>
    </p>
    <th:block sec:authorize="hasRole('CUSTOMER')">
        <form th:if="${product.purchasable}" th:action="@{/cart/items}" method="post" class="d-flex gap-2 align-items-end">
            <input type="hidden" name="productId" th:value="${product.id}">
            <label>Số lượng <input class="form-control" type="number" name="quantity" value="1" min="1" max="2147483647" required></label>
            <button class="btn btn-primary">Thêm vào giỏ</button>
        </form>
        <p class="text-muted" th:if="${!product.purchasable and !product.packageSuspended}" th:text="${product.purchaseProblem}"></p>
        <a th:if="${product.appointmentService}" th:href="@{/appointments/slots(serviceId=${product.id})}">Đặt lịch dịch vụ này</a>
    </th:block>
    <a sec:authorize="isAnonymous()" th:unless="${product.packageSuspended}" th:href="@{/login}">Đăng nhập để mua hàng</a>
</div>
</body></html>
