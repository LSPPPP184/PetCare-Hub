<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title}">PetCare Hub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" th:href="@{/css/petcare.css}"></head><body>
<header th:fragment="header" th:with="navPath=${#ctx.getExchange().getRequest().getPathWithinApplication()}" class="bg-light border-bottom mb-4 pc-header"><a class="pc-skip" href="#pc-content">Bỏ qua menu, tới nội dung</a><nav class="container py-3 d-flex flex-wrap gap-3 align-items-center" aria-label="Menu chính">
<a class="navbar-brand fw-bold pc-brand" th:href="@{/}" th:with="navCurrent=${navPath == '/'}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}"><svg class="pc-brand-mark" viewBox="0 0 40 40" aria-hidden="true"><ellipse cx="20" cy="27" rx="12" ry="10"/><ellipse cx="7" cy="15" rx="5" ry="6"/><ellipse cx="17" cy="8" rx="5" ry="6"/><ellipse cx="29" cy="10" rx="5" ry="6"/><ellipse cx="35" cy="21" rx="4" ry="5"/></svg>PetCare Hub</a>
<details class="pc-menu"><summary>Menu</summary><div class="pc-menu-links">
<a th:href="@{/products}" th:with="navCurrent=${(navPath == '/products' or #strings.startsWith(navPath, '/products/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Danh mục</a>
<th:block th:replace="~{matching/navigation :: links}"></th:block>
<a th:href="@{/appointments/services}" th:with="navCurrent=${(navPath == '/appointments/services' or navPath == '/appointments/slots' or navPath == '/appointments/confirm')}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Đặt lịch dịch vụ</a>
<th:block th:replace="~{health/navigation :: links}"></th:block>
<a sec:authorize="hasRole('CUSTOMER')" th:href="@{/appointments}" th:with="navCurrent=${(navPath == '/appointments' or #strings.startsWith(navPath, '/appointments/')) and !(navPath == '/appointments/services' or navPath == '/appointments/slots' or navPath == '/appointments/confirm')}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Lịch hẹn của tôi</a>
<a sec:authorize="hasAnyRole('STAFF','ADMIN')" th:href="@{/staff/appointments}" th:with="navCurrent=${(navPath == '/staff/appointments' or #strings.startsWith(navPath, '/staff/appointments/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Lịch làm việc</a>
<a sec:authorize="hasAnyRole('STAFF','ADMIN')" th:href="@{/staff/products}" th:with="navCurrent=${(navPath == '/staff/products' or #strings.startsWith(navPath, '/staff/products/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Quản lý sản phẩm</a>
<a sec:authorize="hasRole('CUSTOMER')" th:href="@{/cart}" th:with="navCurrent=${(navPath == '/cart' or #strings.startsWith(navPath, '/cart/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Giỏ hàng</a>
<a sec:authorize="hasRole('CUSTOMER')" th:href="@{/checkout}" th:with="navCurrent=${(navPath == '/checkout' or #strings.startsWith(navPath, '/checkout/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Đặt hàng</a>
<a sec:authorize="hasRole('CUSTOMER')" th:href="@{/orders}" th:with="navCurrent=${(navPath == '/orders' or #strings.startsWith(navPath, '/orders/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Đơn hàng của tôi</a>
<a sec:authorize="hasAnyRole('STAFF','ADMIN')" th:href="@{/staff/orders}" th:with="navCurrent=${(navPath == '/staff/orders' or #strings.startsWith(navPath, '/staff/orders/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Quản lý đơn hàng</a>
<a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}" th:with="navCurrent=${(navPath == '/admin' or #strings.startsWith(navPath, '/admin/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Quản trị</a>
<a sec:authorize="hasAnyRole('STAFF','ADMIN')" th:href="@{/staff}" th:with="navCurrent=${(navPath == '/staff' or #strings.startsWith(navPath, '/staff/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Nhân viên</a>
<th:block th:replace="~{loyalty/navigation :: links}"></th:block>
<th:block th:replace="~{subscriptions/navigation :: links}"></th:block>
<a sec:authorize="isAnonymous()" th:href="@{/register}" th:with="navCurrent=${navPath == '/register'}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Đăng ký</a>
<a sec:authorize="isAnonymous()" th:href="@{/login}" th:with="navCurrent=${navPath == '/login'}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Đăng nhập</a>
<span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Đăng xuất</button></form>
</div></details></nav><span id="pc-content" class="pc-skip-target" tabindex="-1"></span></header>
<div th:fragment="flash" class="pc-flash" role="status" aria-live="polite" aria-atomic="true"><p class="alert alert-success" th:if="${success}" th:text="${success}"></p><p class="alert alert-danger" role="alert" th:if="${error}" th:text="${error}"></p></div>
<footer th:fragment="footer" class="container border-top py-4 mt-5 text-muted pc-footer"><span><strong>PetCare Hub</strong> — Chăm sóc thú cưng bằng cả trái tim.</span><span>Đồng hành từ những điều nhỏ nhất, mỗi ngày.</span></footer>
</body></html>
