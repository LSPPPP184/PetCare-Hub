<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><head th:fragment="head(title)"><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title th:text="${title}">PetCare Hub</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"></head><body>
<header th:fragment="header" class="bg-light border-bottom mb-4"><nav class="container py-3 d-flex flex-wrap gap-3 align-items-center" aria-label="Menu chính">
<a class="navbar-brand fw-bold" th:href="@{/}">PetCare Hub</a>
<a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/dashboard}">Quản trị</a>
<a sec:authorize="hasAnyRole('STAFF','ADMIN')" th:href="@{/staff/dashboard}">Nhân viên</a>
<span sec:authorize="hasRole('CUSTOMER')">Khách hàng thân thiết</span>
<a sec:authorize="isAnonymous()" th:href="@{/register}">Đăng ký</a>
<a sec:authorize="isAnonymous()" th:href="@{/login}">Đăng nhập</a>
<span sec:authorize="isAuthenticated()" sec:authentication="name"></span>
<form sec:authorize="isAuthenticated()" th:action="@{/logout}" method="post"><button class="btn btn-outline-secondary">Đăng xuất</button></form>
</nav></header>
<div th:fragment="flash" role="status"><p class="alert alert-success" th:if="${success}" th:text="${success}"></p></div>
<footer th:fragment="footer" class="container border-top py-4 mt-5 text-muted">PetCare Hub — Chăm sóc thú cưng bằng cả trái tim.</footer>
</body></html>
