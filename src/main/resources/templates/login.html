<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head><body><header th:replace="~{fragments/layout :: header}"></header><main class="container"><div th:replace="~{fragments/layout :: flash}"></div><h1>Đăng nhập</h1><p th:if="${param.error}" class="alert alert-danger">Email hoặc mật khẩu không đúng.</p><p th:if="${param.logout}" class="alert alert-success">Bạn đã đăng xuất.</p><form th:action="@{/login}" method="post" class="col-md-6"><label for="email" class="form-label">Email</label><input class="form-control mb-3" id="email" name="email" type="email" autocomplete="username" required><label for="password" class="form-label">Mật khẩu</label><input class="form-control mb-3" id="password" name="password" type="password" autocomplete="current-password" required><button class="btn btn-primary">Đăng nhập</button></form></main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
