<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"><body>
<th:block th:fragment="links" th:with="navPath=${#ctx.getExchange().getRequest().getPathWithinApplication()}">
    <a sec:authorize="hasRole('CUSTOMER')" th:href="@{/membership}" th:with="navCurrent=${(navPath == '/membership' or #strings.startsWith(navPath, '/membership/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Thẻ thành viên</a>
    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin/members}" th:with="navCurrent=${(navPath == '/admin/members' or #strings.startsWith(navPath, '/admin/members/'))}" th:classappend="${navCurrent} ? 'pc-nav-current' : ''" th:attr="aria-current=${navCurrent ? 'page' : null}">Quản lý thành viên</a>
</th:block>
</body></html>
