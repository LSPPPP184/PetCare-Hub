<!DOCTYPE html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><body>
<span th:fragment="badge(appointment)" class="badge" th:classappend="${appointment.badgeClass}" th:text="${appointment.label}"></span>
<div th:fragment="actions(appointment, staff)" class="d-flex gap-2 flex-wrap">
    <th:block th:if="${staff}"><form th:each="action : ${appointment.actions}" method="post"
        th:action="@{/staff/appointments/{id}/{action}(id=${appointment.id},action=${action.path})}">
        <button class="btn btn-outline-primary btn-sm" th:text="${action.label}"></button>
    </form></th:block>
    <form th:if="${!staff and appointment.customerCanCancel}" method="post" th:action="@{/appointments/{id}/cancel(id=${appointment.id})}">
        <button class="btn btn-outline-danger btn-sm">Hủy lịch</button>
    </form>
</div>
</body></html>
