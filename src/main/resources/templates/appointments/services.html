<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Đặt lịch dịch vụ')}"></head><body>
<header th:replace="~{fragments/layout :: header}"></header>
<main class="container pc-customer">
    <div th:replace="~{fragments/layout :: flash}"></div>
    <p class="pc-eyebrow">Mỗi lịch hẹn, một sự quan tâm</p><h1>Đặt lịch dịch vụ</h1><p>Chọn dịch vụ, ngày và nhân viên có khung giờ phù hợp. Tất cả thời gian theo giờ Việt Nam.</p>
    <ol class="pc-steps" aria-label="Các bước đặt lịch"><li aria-current="step"><span aria-hidden="true">1</span>Chọn dịch vụ</li><li><span aria-hidden="true">2</span>Chọn ngày và giờ</li><li><span aria-hidden="true">3</span>Xác nhận lịch hẹn</li></ol><p class="pc-empty" role="status" th:if="${services.empty}">Chưa có dịch vụ đặt lịch.</p>
    <div class="row g-3 pc-service-grid"><article class="col-md-6" th:each="service : ${services}"><div class="card h-100"><div class="card-body pc-service-card">
        <span class="pc-card-mark" aria-hidden="true">♡</span><h2 class="h4" th:text="${service.name}"></h2><p th:text="${service.description}"></p>
        <p class="pc-price" th:text="${service.durationMinutes + ' phút — ' + service.price + ' VNĐ'}"></p>
        <a class="btn btn-primary" sec:authorize="hasRole('CUSTOMER')" th:href="@{/appointments/slots(serviceId=${service.id})}">Chọn ngày và khung giờ</a>
        <a sec:authorize="isAnonymous()" th:href="@{/login}">Đăng nhập để đặt lịch</a>
        <a class="ms-2" th:href="@{/products/{id}(id=${service.id})}">Chi tiết dịch vụ</a>
    </div></div></article></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
