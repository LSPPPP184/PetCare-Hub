<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Chi tiết sản phẩm')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <nav class="pc-breadcrumb" aria-label="Điều hướng sản phẩm"><a th:href="@{/products}">Danh mục sản phẩm</a> · <a sec:authorize="hasAnyRole('ADMIN','STAFF')" th:href="@{/staff/products}">Quản lý sản phẩm</a></nav>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <div class="pc-detail">
        <div class="container pc-detail-art" th:insert="~{products/image :: image(${product})}"></div>
        <section class="pc-detail-copy">
            <h1>Chi tiết sản phẩm</h1>
            <h2 th:text="${product.name}"></h2>
            <p th:text="${product.description}"></p>
            <p class="pc-price" th:text="${product.price + ' VNĐ'}"></p>
            <dl><div th:each="d : ${product.details}"><dt th:text="${d.key}"></dt><dd th:text="${d.value}"></dd></div></dl>
            <div th:replace="~{commerce/purchase :: purchase(${product})}"></div>
        </section>
    </div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
