<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/layout :: head('Sản phẩm')}"></head>
<body><header th:replace="~{fragments/layout :: header}"></header>
<main class="container">
    <nav class="pc-breadcrumb" aria-label="Điều hướng danh mục"><a th:href="@{/products}" aria-current="page">Danh mục sản phẩm</a> · <a sec:authorize="hasAnyRole('ADMIN','STAFF')" th:href="@{/staff/products}">Quản lý sản phẩm</a></nav>
    <div th:replace="~{fragments/layout :: flash}"></div>
    <p class="pc-eyebrow">Những điều nhỏ, niềm vui lớn</p>
    <h1>Sản phẩm</h1>
    <p class="pc-lead">Tìm một người bạn, một món đồ yêu thích hay một dịch vụ chăm sóc thật phù hợp.</p>
    <a class="btn btn-outline-primary mb-4" th:if="${staff == true}" th:href="@{/staff/products/new}">Thêm sản phẩm</a>
    <div class="pc-catalog">
        <form method="get" class="pc-panel pc-filter">
            <h2>Tìm điều phù hợp</h2>
            <label for="catalog-query">Tên sản phẩm</label>
            <input id="catalog-query" name="q" placeholder="Tìm theo tên" th:value="${param.q}">
            <label for="catalog-group">Nhóm sản phẩm</label>
            <select id="catalog-group" name="group"><option value="">Tất cả nhóm</option><option value="PET" th:selected="${param.group != null and param.group[0] == 'PET'}">Thú cưng</option><option value="ACCESSORY" th:selected="${param.group != null and param.group[0] == 'ACCESSORY'}">Phụ kiện</option><option value="SERVICE" th:selected="${param.group != null and param.group[0] == 'SERVICE'}">Dịch vụ</option></select>
            <label for="catalog-sort">Sắp xếp theo giá</label>
            <select id="catalog-sort" name="descending"><option value="false">Giá tăng dần</option><option value="true" th:selected="${param.descending != null and param.descending[0] == 'true'}">Giá giảm dần</option></select>
            <button class="btn btn-primary">Lọc</button>
        </form>
        <section aria-label="Kết quả sản phẩm">
            <p class="pc-empty" role="status" th:if="${products.empty}">Không có sản phẩm phù hợp.</p>
            <div class="row pc-product-grid">
                <article class="col-md-4 border p-3 pc-product-card" th:each="p : ${products.content}">
                    <div th:replace="~{products/image :: image(${p})}"></div>
                    <h2 th:text="${p.name}"></h2><p class="pc-price" th:text="${p.price + ' VNĐ'}"></p><a th:href="@{/products/{id}(id=${p.id})}">Chi tiết</a>
                    <div th:replace="~{commerce/purchase :: purchase(${p})}"></div>
                    <div class="pc-product-management" th:if="${staff == true}"><span class="pc-catalog-status" th:text="${p.active ? 'Đang hiển thị' : 'Đã ẩn'}"></span><a class="btn btn-outline-primary btn-sm" th:href="@{/staff/products/{id}/edit(id=${p.id})}">Sửa</a><form th:action="@{/staff/products/{id}/hide(id=${p.id})}" method="post"><button class="btn btn-outline-danger btn-sm">Ẩn sản phẩm</button></form></div>
                </article>
            </div>
            <nav class="pc-pagination" aria-label="Phân trang sản phẩm"><a th:if="${products.hasPrevious()}" th:href="@{''(page=${products.number-1},group=${param.group},q=${param.q},descending=${param.descending})}">Trang trước</a> <span aria-current="page" th:text="${products.number+1}"></span> <a th:if="${products.hasNext()}" th:href="@{''(page=${products.number+1},group=${param.group},q=${param.q},descending=${param.descending})}">Trang sau</a></nav>
        </section>
    </div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer></body></html>
