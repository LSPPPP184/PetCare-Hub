<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
    <head th:replace="~{fragments/layout :: head('Đăng ký')}">
    </head>
    <body>
        <header th:replace="~{fragments/layout :: header}">
        </header>
        <main class="container">
            <div th:replace="~{fragments/layout :: flash}">
            </div>
            <h1>Đăng ký</h1>
            <form th:action="@{/register}" th:object="${registration}" method="post" class="col-md-6">
                <label for="fullName" class="form-label">Họ tên</label>
                <input class="form-control" id="fullName" th:field="*{fullName}" type="text">
                <p class="text-danger" th:errors="*{fullName}">
                </p>
                <label for="email" class="form-label">Email</label>
                <input class="form-control" id="email" th:field="*{email}" type="email">
                <p class="text-danger" th:errors="*{email}">
                </p>
                <label for="password" class="form-label">Mật khẩu (8–72 ký tự ASCII)</label>
                <input class="form-control" id="password" name="password" autocomplete="new-password" type="password">
                <p class="text-danger" th:errors="*{password}">
                </p>
                <label for="phone" class="form-label">Số điện thoại (tùy chọn)</label>
                <input class="form-control" id="phone" th:field="*{phone}" type="tel">
                <p class="text-danger" th:errors="*{phone}">
                </p>
                <button class="btn btn-primary">Tạo tài khoản</button>
            </form>
        </main>
        <footer th:replace="~{fragments/layout :: footer}">
        </footer>
    </body>
</html>
